name: Build and Test

on: 
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build: 
    runs-on: ${{ matrix.os }}
    strategy: 
      fail-fast: false
      matrix:
        # ubuntu: no GPU, uses lavapipe (software Vulkan) installed below
        # macos:  real Metal device on the hosted runner
        # windows: no GPU, uses WARP (software DX12, built into Windows)
        os: [ubuntu-latest, macos-latest, windows-latest]
        # os: [ubuntu-latest, ubuntu-26.04-arm, macos-latest, windows-latest]  # arm is public preview

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.13'
    - name: Set up Python environment
      shell: bash
      run: |
        echo "PYO3_PYTHON=$(python3 -c 'import sys; print(sys.executable)')" >> $GITHUB_ENV

    - name: Set macOS linker flags
      if: runner.os == 'macOS'
      run: |
        echo "CARGO_TARGET_AARCH64_APPLE_DARWIN_RUSTFLAGS=-C link-arg=-undefined -C link-arg=dynamic_lookup" >> $GITHUB_ENV
        echo "CARGO_TARGET_X86_64_APPLE_DARWIN_RUSTFLAGS=-C link-arg=-undefined -C link-arg=dynamic_lookup" >> $GITHUB_ENV

    - name: Install software Vulkan driver (lavapipe)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y mesa-vulkan-drivers libvulkan1 vulkan-tools
        vulkaninfo --summary   # should list "llvmpipe"

    - name: Build
      run: cargo build
    - name: Run tests
      run: cargo test
